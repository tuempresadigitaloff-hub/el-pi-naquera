<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservas · Administración El Pi</title><link rel="stylesheet" href="css/style.css?v=premium-20261122-v3">
<style>
.admin-wrap{max-width:1100px;margin:60px auto;padding:0 22px}.panel{background:#fff;border:1px solid #e7e1d6;border-radius:16px;padding:24px;margin:18px 0}
input,select,button{font:inherit;padding:11px;border:1px solid #d8d2c6;border-radius:8px;max-width:100%}
button{background:#20392c;color:white;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.booking{border:1px solid #e7e1d6;border-radius:12px;padding:16px;margin:12px 0}.booking h3{margin:0 0 8px}.muted{color:#777}.hidden{display:none}.danger{background:#8f2f2f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.status{margin-top:12px}
</style></head><body><main class="admin-wrap">
<a href="index.html">← Volver a la web</a><h1>Panel de reservas</h1>
<section id="login" class="panel"><h2>Acceso privado</h2><p class="muted">Entra con el usuario que el administrador haya creado en Supabase.</p>
<div class="grid"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label></div>
<div class="toolbar"><button id="login-btn">Iniciar sesión</button></div><p id="login-msg" class="status" aria-live="polite"></p></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="toolbar" style="justify-content:space-between"><div><h2>Reservas compartidas</h2><p class="muted">Los cambios se guardan en la nube y se ven desde todos tus dispositivos.</p></div><button id="logout" class="danger">Cerrar sesión</button></div>
<div class="toolbar"><input id="day" type="date"><select id="filter"><option value="all">Todos los estados</option><option value="confirmed">Confirmadas</option><option value="cancelled">Canceladas</option></select><button id="refresh">Actualizar</button></div>
<div id="summary" class="muted"></div><div id="bookings"></div><p id="dash-msg" class="status" aria-live="polite"></p></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script>
<script>
(() => {
 const $=id=>document.getElementById(id); let sb=null;
 const msg=(id,t)=>$(id).textContent=t;
 const ready=()=>window.supabase&&window.ELPI_SUPABASE_URL&&!window.ELPI_SUPABASE_URL.includes('TU-PROYECTO')&&window.ELPI_SUPABASE_ANON_KEY&&!window.ELPI_SUPABASE_ANON_KEY.includes('TU_CLAVE');
 if(ready()) sb=window.supabase.createClient(window.ELPI_SUPABASE_URL,window.ELPI_SUPABASE_ANON_KEY);
 $('login-btn').onclick=async()=>{
   if(!sb){msg('login-msg','Configura primero js/supabase-config.js.');return;}
   const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});
   if(error){msg('login-msg','No se ha podido iniciar sesión. Revisa tus credenciales.');return;}
   $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('day').value=new Date().toISOString().slice(0,10);await load();
 };
 $('logout').onclick=async()=>{await sb.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');};
 $('refresh').onclick=load;$('day').onchange=load;$('filter').onchange=load;
 async function load(){
   if(!sb)return;
   const {data,error}=await sb.from('reservations').select('id,reference,name,phone,email,booking_date,booking_time,people,notes,status,created_at').eq('booking_date',$('day').value).order('booking_time');
   if(error){msg('dash-msg','No se pudieron cargar las reservas. Comprueba el usuario y los permisos.');return;}
   const shown=(data||[]).filter(x=>$('filter').value==='all'||x.status===$('filter').value);
   msg('summary',`${shown.length} reservas · ${shown.reduce((n,x)=>n+x.people,0)} comensales`);
   $('bookings').innerHTML=shown.length?shown.map(x=>`<article class="booking"><h3>${esc(x.booking_time)} · ${esc(x.name)} <small>(${x.people} personas)</small></h3><p><b>Referencia:</b> ${esc(x.reference)} · <b>Estado:</b> ${x.status==='confirmed'?'Confirmada':'Cancelada'}</p><p><b>Teléfono:</b> ${esc(x.phone)} ${x.email?`· <b>Email:</b> ${esc(x.email)}`:''}</p>${x.notes?`<p><b>Notas:</b> ${esc(x.notes)}</p>`:''}<div class="toolbar"><button class="danger" data-cancel="${x.id}" ${x.status==='cancelled'?'disabled':''}>Cancelar reserva</button></div></article>`).join(''):'<p class="muted">No hay reservas para este día y filtro.</p>';
   document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Cancelar esta reserva?'))return;const {error}=await sb.from('reservations').update({status:'cancelled'}).eq('id',b.dataset.cancel);if(error)msg('dash-msg','No se pudo cancelar.');else await load();});
   msg('dash-msg','');
 }
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
})();
</script></body></html>
